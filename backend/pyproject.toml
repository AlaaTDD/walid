[project]
name = "sheet-nesting-backend"
version = "1.0.0"
description = "High-precision irregular sheet nesting backend for print production"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "shapely>=2.0.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    # Writes Photoshop-compatible layer data in TIFF tag 37724.  The package
    # uses NumPy and stdlib ZIP compression, so output layers remain lossless
    # without relying on an external Photoshop installation.
    "psdtags>=2025.1.1",
    "opencv-python-headless>=4.9.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
