name: Build Release Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Windows App
        shell: cmd
        run: |
          REM Using the script we created earlier
          call build_release.bat

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SheetNestingApp-Windows
          path: release/SheetNestingApp-Setup.exe
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build macOS App
        run: |
          chmod +x build_release.sh
          ./build_release.sh macos

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SheetNestingApp-macOS
          path: release/*.dmg
          if-no-files-found: warn
